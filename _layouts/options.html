---
layout: default
---
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;700&family=Geist+Mono:wght@300;400&display=swap');

  * {
    box-sizing: border-box;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .op {
    min-height: 100vh;
    width: 100%;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(2rem, 5vw, 5rem);
    background:
      radial-gradient(circle at 20% 20%, rgba(130, 150, 255, 0.16), transparent 32rem),
      radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.08), transparent 28rem),
      linear-gradient(135deg, #060914 0%, #0a102d 52%, #101735 100%);
    color: #fff;
    isolation: isolate;
  }

  .op::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 4rem 4rem;
    mask-image: radial-gradient(circle at center, black, transparent 75%);
    pointer-events: none;
    z-index: -2;
  }

  .op::after {
    content: "";
    position: absolute;
    width: 28rem;
    height: 28rem;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    filter: blur(70px);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: -1;
  }

  .op-frame {
    position: absolute;
    inset: clamp(1rem, 3vw, 2.5rem);
    border: 1px solid rgba(255,255,255,0.1);
    pointer-events: none;
  }

  .op-header {
    position: absolute;
    top: clamp(1.75rem, 5vw, 4rem);
    left: clamp(1.75rem, 5vw, 4rem);
  }

  .op-wordmark {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.2rem, 2vw, 1.8rem);
    font-weight: 700;
    letter-spacing: 0.04em;
    color: rgba(255,255,255,0.88);
  }

  .op-site-link {
    display: inline-block;
    margin-top: 0.45rem;
    font-family: 'Geist Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.38);
    text-decoration: none;
    transition: color 0.3s ease;
  }

  .op-site-link:hover,
  .op-site-link:focus-visible {
    color: #fff;
  }

  .op-core {
    width: min(100%, 980px);
    display: flex;
    flex-direction: column;
    animation: riseIn 1s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .op-item {
    position: relative;
    display: grid;
    grid-template-columns: 4rem 1fr auto;
    align-items: center;
    gap: clamp(1rem, 3vw, 3rem);
    padding: clamp(1.4rem, 4vw, 3rem) 0;
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .op-item:first-child {
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  .op-item::before {
    content: "";
    position: absolute;
    inset: 0 -2rem;
    background: rgba(255,255,255,0.055);
    opacity: 0;
    transform: scaleX(0.96);
    transition: opacity 0.35s ease, transform 0.35s ease;
    z-index: -1;
  }

  .op-item:hover::before,
  .op-item:focus-visible::before {
    opacity: 1;
    transform: scaleX(1);
  }

  .op-num {
    font-family: 'Geist Mono', monospace;
    font-size: clamp(0.65rem, 1vw, 0.8rem);
    letter-spacing: 0.22em;
    color: rgba(255,255,255,0.32);
  }

  .op-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 4em;
    font-weight: 300;
    line-height: 0.9;
    letter-spacing: -0.055em;
    color: rgba(255,255,255,0.94);
    transition: transform 0.35s ease, color 0.35s ease;
  }

  .op-arrow {
    font-family: 'Geist Mono', monospace;
    font-size: clamp(1rem, 2vw, 1.4rem);
    color: rgba(255,255,255,0.28);
    transform: translateX(-0.5rem);
    transition: transform 0.35s ease, color 0.35s ease;
  }

  .op-item:hover .op-label,
  .op-item:focus-visible .op-label {
    transform: translateX(0.5rem);
    color: #fff;
  }

  .op-item:hover .op-arrow,
  .op-item:focus-visible .op-arrow {
    transform: translateX(0);
    color: #fff;
  }

  .op-footer {
    position: absolute;
    left: clamp(1.75rem, 5vw, 4rem);
    right: clamp(1.75rem, 5vw, 4rem);
    bottom: clamp(1.75rem, 5vw, 4rem);
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    font-family: 'Geist Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.26);
  }

  @keyframes riseIn {
    from {
      opacity: 0;
      transform: translateY(1.5rem);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 700px) {
    .op {
      justify-content: flex-end;
      padding-bottom: 8rem;
    }

    .op-item {
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }

    .op-arrow {
      display: none;
    }

    .op-label {
      font-size: clamp(3.2rem, 17vw, 5.5rem);
    }

    .op-footer {
      flex-direction: column;
    }
  }
</style>

<h2 class="sr-only">
  Options page with three navigation links: Option One, Option Two, Option Three.
</h2>

<section class="op">
  <div class="op-frame"></div>

  <header class="op-header">
    <span class="op-wordmark">{{site.title}}</span>
    <a class="op-site-link" href="/">Home</a>
  </header>

  <nav class="op-core" aria-label="Primary options">
    <a class="op-item" href="/blog/">
      <span class="op-num">01</span>
      <span class="op-label">Thoughts</span>
      <span class="op-arrow">↗</span>
    </a>

    <a class="op-item" href="/patterns/">
      <span class="op-num">02</span>
      <span class="op-label">Patterns</span>
      <span class="op-arrow">↗</span>
    </a>

    <a class="op-item" href="/links/">
      <span class="op-num">03</span>
      <span class="op-label">Links</span>
      <span class="op-arrow">↗</span>
    </a>
  </nav>

  <footer class="op-footer">
    <span>no. 01</span>
    <span id="greeting"></span>
    <span>2026</span>
  </footer>
</section>
