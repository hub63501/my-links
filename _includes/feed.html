<div class="margin-bottom">
    <p>>>></p>
    <h3 class="">Posts</h3>
    <p>>>></p>
</div>
<div class="flex-layout">

    {% for post in site.posts %}
    <div class="card">
        <div class="card-image">
            <img src="{{post.img}}" class="db" alt="Photo">
        </div>
        <div class="card-content">
            <a href="{{ post.url | prepend: site.baseurl }}"><h1 class="card-title">{{post.title}}</h1></a>
            <p class="card-description">
                {{post.description}}
            </p>
            <p class="">By {{post.author}}</p>
            <a class="" href="{{ post.url | prepend: site.baseurl }}">Read</a>
        </div>
    </div>
    {% endfor %}

</div>
