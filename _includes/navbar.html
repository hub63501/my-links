

<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .page-wrap {
    font-family: 'DM Sans', sans-serif;
    min-height: 900px;
    background: var(--color-background-tertiary);
    overflow-y: auto;
    max-height: 900px;
  }

  .header-outer {
    position: sticky;
    top: 0;
    width: 100%;
    z-index: 100;
    display: flex;
    justify-content: center;
    padding: 0;
    transition: padding 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .header-outer.pill {
    padding: 10px 0;
  }

  .header-bar {
    background: #0a0a0a;
    width: 100%;
    max-width: 100%;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 0;
    transition:
      border-radius 0.45s cubic-bezier(0.4, 0, 0.2, 1),
      max-width 0.45s cubic-bezier(0.4, 0, 0.2, 1),
      height 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .header-outer.pill .header-bar {
    max-width: 420px;
    border-radius: 999px;
    height: 44px;
  }

  .nav-2 {
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .nav-2 a {
    font-size: 13px;
    font-weight: 400;
    color: rgba(255,255,255,0.55);
    text-decoration: none;
    padding: 6px 16px;
    border-radius: 999px;
    transition: color 0.2s, background 0.2s;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  .nav-2 a:hover { color: #fff; background: rgba(255,255,255,0.08); }
  .nav-2 a.active { color: #fff; }

  .page-content {
    max-width: 680px;
    margin: 0 auto;
    padding: 3rem 2rem 6rem;
  }

  .hero { padding: 3rem 0 2rem; }

  .hero h1 {
    font-size: 32px;
    font-weight: 300;
    color: var(--color-text-primary);
    line-height: 1.25;
    margin-bottom: 1rem;
    letter-spacing: -0.02em;
  }

  .hero p {
    font-size: 14px;
    color: var(--color-text-secondary);
    line-height: 1.7;
    max-width: 480px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-top: 2.5rem;
  }


  .filler { margin-top: 2rem; display: flex; flex-direction: column; gap: 10px; }

  .filler-block {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 1.25rem;
  }

  .filler-line {
    height: 9px;
    background: var(--color-background-secondary);
    border-radius: 4px;
    margin-bottom: 9px;
  }

  .scroll-hint {
    text-align: center;
    font-size: 12px;
    color: var(--color-text-tertiary);
    padding: 2rem 0 0;
    letter-spacing: 0.04em;
  }

  .state-label {
    text-align: center;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-text-tertiary);
    padding: 2rem 0 1rem;
    transition: opacity 0.3s;
  }
</style>


<nav class="nav navbar">
  <div class="nav-container overflow-x-auto">
      <a href="/" class="nav-logo">Five-Link</a>
      <ul class="nav-links">
          <li><a href="/blog/">Blog</a></li>
          <li><a href="/about/">About</a></li>
          <li><a href="/projects/">Projects</a></li>
          <li><a href="/options/">Options</a></li>
      </ul>
  </div>
</nav>


<script>
  const wrap = document.getElementById('pageWrap');
  const outer = document.getElementById('headerOuter');
  const stateVal = document.getElementById('stateVal');
  const sWcrollVal = document.getElementById('scrollVal');
  const stateLabel = document.getElementById('stateLabel');

  wrap.addEventListener('scroll', () => {
    const s = wrap.scrollTop;
    scrollVal.textContent = Math.round(s) + 'px';

    if (s > 40) {
      outer.classList.add('pill');
      stateVal.textContent = 'Pill';
      stateLabel.textContent = 'Pill — scroll up to revert';
    } else {
      outer.classList.remove('pill');
      stateVal.textContent = 'Bar';
      stateLabel.textContent = 'Bar — scroll down';
    }
  });
</script>
